name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l cotizador_hc_.php
      - run: php tests/regression.php
      - run: php tests/no-woocommerce.php
      - run: node --check js/scripts.js
      - run: node tests/frontend.cjs
